{% extends "templates/web.html" %}

{% block page_content %}

<div id="chat-webview-container"></div>

<script>
  // تأكد إن الشات يشتغل بوضع webview
  if (!window.location.search.includes("cc_webview=1")) {
    window.location.href = window.location.pathname + "?cc_webview=1";
  }
</script>

<style>
  body {
    margin: 0;
    overflow: hidden;
  }

  .chat-app {
    position: fixed;
    inset: 0;
    height: 100vh;
    width: 100vw;
  }

  .chat_right_section,
  .chat-element {
    height: 100vh !important;
    width: 100% !important;
  }

  .chat_left_section {
    display: block !important;
  }

  .chat-bubble,
  .chat-navbar-icon {
    display: none !important;
  }
</style>

{% endblock %}
